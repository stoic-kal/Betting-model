{% extends "base.html" %}

{% block content %}
<div style="text-align: center; margin-bottom: 30px;">
    <h1>🏆 TODAY'S PICKS</h1>
    <p style="color: #666;">Model: LightGBM | Accuracy: 77.4%</p>
</div>

<div style="text-align: center; margin-bottom: 30px;">
    <button onclick="generatePicks()" class="btn" style="padding: 12px 40px; font-size: 16px; margin-right: 10px;">
        ⚡ GENERATE PICKS
    </button>
    <a href="/all-picks" class="btn" style="background:var(--green)!important" style="padding: 12px 40px; font-size: 16px; text-decoration: none;">
        📋 VIEW ALL PICKS
    </a>
</div>

<div id="successMessage" style="display:none; background: #90EE90; border: 3px solid #333; padding: 15px; margin-bottom: 20px; ">
    ✅ PICKS LOADED!
</div>

<div id="errorMessage" style="display:none; background: #FFB6C6; border: 3px solid #333; padding: 15px; margin-bottom: 20px; ">
    ❌ <span id="errorText"></span>
</div>

<!-- TOP 5 MONEYLINE PICKS -->
<div style="margin-bottom: 40px;">
    <h2 style="color: #FF6B6B; border-bottom: 3px solid #FF6B6B; padding-bottom: 10px;">🔴 TOP 5 MONEYLINE PICKS</h2>
    <div id="mlPicks" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 15px;">
        <p style="color: #999; grid-column: 1/-1;">Generate picks to see recommendations</p>
    </div>
</div>

<!-- TOP 5 TOTALS PICKS -->
<div style="margin-bottom: 40px;">
    <h2 style="color: #FFD700; border-bottom: 3px solid #FFD700; padding-bottom: 10px;">🟡 TOP 5 TOTALS PICKS</h2>
    <div id="totalsPicks" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 15px;">
        <p style="color: #999; grid-column: 1/-1;">Generate picks to see recommendations</p>
    </div>
</div>

<script>
function generatePicks() {
    document.getElementById('successMessage').style.display = 'none';
    document.getElementById('errorMessage').style.display = 'none';
    
    fetch('/api/run-picks', {method:'POST', headers:{'X-Requested-With':'Jingleez'}})
        .then(r => r.json())
        .then(data => {
            if (data.status === 'success') {
                document.getElementById('successMessage').style.display = 'block';
                loadTodaysPicks();
            } else {
                showError(data.message || 'Error generating picks');
            }
        })
        .catch(err => showError(err.message));
}

function loadTodaysPicks() {
    const today = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit'
    }).format(new Date());
    
    fetch(`/api/picks-by-date?date=${today}`)
        .then(r => r.json())
        .then(picks => {
            const ml = picks.filter(p => p.pick_type === 'moneyline').sort((a, b) => b.ev - a.ev).slice(0, 5);
            const totals = picks.filter(p => p.pick_type === 'totals').sort((a, b) => b.ev - a.ev).slice(0, 5);
            
            document.getElementById('mlPicks').innerHTML = ml.length > 0 
                ? ml.map(p => createPickCard(p)).join('')
                : '<p style="color: #999; grid-column: 1/-1;">No moneyline picks</p>';
            
            document.getElementById('totalsPicks').innerHTML = totals.length > 0
                ? totals.map(p => createPickCard(p)).join('')
                : '<p style="color: #999; grid-column: 1/-1;">No totals picks</p>';
        })
        .catch(err => showError(err.message));
}

function kellyUnits(prob, decimalOdds, fraction=0.5) {
    const b = parseFloat(decimalOdds) - 1;
    if (b <= 0 || !prob) return '—';
    const p = parseFloat(prob), q = 1 - p;
    const full = (b * p - q) / b;
    const halfKelly = full * fraction;
    if (halfKelly <= 0) return '—';
    if (halfKelly < 0.05) return '0.25u';
    if (halfKelly < 0.10) return '0.50u';
    return '1.00u';
}

function createPickCard(pick) {
    const bgColor = pick.ev > 50 ? '#90EE90' : pick.ev > 20 ? '#FFFACD' : '#FFB6C6';
    const kelly = kellyUnits(pick.model_prob, pick.odds);

    return `
        <div style="background: ${bgColor}; border: 3px solid #333; padding: 15px; ">
            <div style="font-weight: bold; margin-bottom: 10px; color: #1a1a2e;">
                ${pick.matchup}
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; font-size: 14px;">
                <div><strong>Pick:</strong> ${pick.pick}</div>
                <div><strong>Odds:</strong> ${parseFloat(pick.odds).toFixed(2)}</div>
                <div><strong>Prob:</strong> ${(pick.model_prob * 100).toFixed(1)}%</div>
                <div><strong>EV:</strong> ${parseFloat(pick.ev).toFixed(1)}%</div>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,0.1);padding:8px;font-size:12px;color:#333;">
                <span>Status: ${pick.status || 'PENDING'}</span>
                <span style="font-weight:bold;color:#1a6e1a;">🎯 Kelly: ${kelly}</span>
            </div>
        </div>
    `;
}

function showError(msg) {
    document.getElementById('errorText').textContent = msg;
    document.getElementById('errorMessage').style.display = 'block';
}

// Auto-load today's picks on page load
window.addEventListener('load', loadTodaysPicks);
</script>
{% endblock %}
