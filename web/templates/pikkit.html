{% extends "base.html" %}
{% block content %}
<style>
.pk-shell{max-width:1080px;margin:auto;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;backdrop-filter:blur(8px)}.pk-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.pk-head h1{margin:0;color:var(--text);font-size:22px;font-weight:800;letter-spacing:-0.02em}.pk-controls{display:flex;gap:7px;flex-wrap:wrap}.pk-btn,.pk-select{background:rgba(255,255,255,0.06);color:var(--text-dim);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 12px;font-family:inherit;font-size:12px;cursor:pointer;transition:all 0.15s}.pk-btn:hover{border-color:var(--amber);background:var(--violet)}.pk-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.pk-stat{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center}.pk-stat strong{display:block;font-size:20px;font-family:'SF Mono','Fira Code',ui-monospace,monospace}.pk-stat span{font-size:9px;color:var(--text-muted)}.positive{color:var(--green);font-weight:700}.negative{color:var(--red);font-weight:700}.pk-week,.pk-calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.pk-week div{text-align:center;color:var(--text-muted);font-size:10px;padding:7px;font-weight:600}.pk-day{min-height:112px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px;cursor:pointer;position:relative;transition:all 0.15s}.pk-day:hover{border-color:var(--amber);transform:translateY(-1px)}.pk-day.empty{background:transparent;border-color:transparent!important;cursor:default;box-shadow:none!important}.pk-day.future{opacity:.55}.pk-num{font-size:11px;color:var(--text-muted)}.pk-record{font-size:12px;margin-top:17px;font-weight:bold}.pk-units{font-size:14px;margin-top:7px}.pk-pending{position:absolute;right:7px;top:7px;font-size:9px;color:var(--amber)}.pk-day.win{background:rgba(16,185,129,0.12);border-color:var(--green)}.pk-day.loss{background:rgba(239,68,68,0.1);border-color:var(--red)}.pk-day.even{background:rgba(255,255,255,0.03);border-color:var(--border)}.pk-legend{font-size:11px;color:var(--text-muted);margin-top:12px}.pk-modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:9999;align-items:center;justify-content:center;padding:18px}.pk-modal-bg.open{display:flex}.pk-modal{background:rgba(14,14,28,0.97);border:1px solid rgba(255,255,255,0.1);border-radius:12px;max-width:900px;width:100%;max-height:85vh;overflow:auto;padding:20px;backdrop-filter:blur(24px)}.pk-modal-head{display:flex;justify-content:space-between;align-items:center}.pk-row{display:grid;grid-template-columns:2fr .6fr 1fr .6fr .6fr .6fr;gap:8px;align-items:center;background:rgba(255,255,255,0.03);border:1px solid #3b4050;padding:10px;margin-top:7px;font-family:inherit;font-size:8px}.pk-tag{font-family:inherit;font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em}.pk-grade{font-weight:bold}.pk-grade.won{color:var(--green);font-weight:700}.pk-grade.lost{color:var(--red);font-weight:700}@media(max-width:700px){.pk-summary{grid-template-columns:repeat(2,1fr)}.pk-week,.pk-calendar{gap:3px}.pk-day{min-height:82px;padding:6px}.pk-record{font-size:9px;margin-top:12px}.pk-units{font-size:10px}.pk-row{grid-template-columns:1fr 1fr}.pk-row span:nth-child(n+5){display:none}}
.pk-unit-wrap{display:flex;justify-content:flex-end;align-items:center;gap:7px;margin-top:10px;color:var(--text-muted);font-size:9px}.pk-unit{width:90px;background:var(--bg-input);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px;font-family:inherit}
</style>
<section class="pk-shell">
  <div class="pk-head"><div><h1>🗓 PIKKIT</h1><div id="pk-month-label" style="color:var(--text-muted);margin-top:7px">Loading…</div></div>
    <div class="pk-controls"><button class="pk-btn" onclick="moveMonth(-1)">◀</button><button class="pk-btn" onclick="goToday()">TODAY</button><button class="pk-btn" onclick="moveMonth(1)">▶</button><select id="pk-type" class="pk-select" onchange="loadPikkit()"><option value="all">ALL PICKS</option><option value="moneyline">MONEYLINE</option><option value="totals">TOTALS</option></select><select id="pk-tier" class="pk-select" onchange="loadPikkit()"><option value="all">ALL FORECASTS</option><option value="recommended">RECOMMENDED</option><option value="strong_lock">STRONG LOCKS</option><option value="daily_forecast">NO-BET FORECASTS</option></select><select id="pk-basis" class="pk-select" onchange="loadPikkit()"><option value="recorded">RECORDED UNITS</option><option value="flat">FLAT 1 UNIT</option></select><button class="pk-btn" onclick="downloadCsv()">⬇ CSV</button></div>
  </div>
  <label class="pk-unit-wrap">1 UNIT = $ <input id="pk-unit-size" class="pk-unit" type="number" min="0.01" max="100000" step="0.01" value="20" onchange="unitChanged()"></label>
  <div class="pk-summary" id="pk-summary"></div>
  <div class="pk-week"><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div>S</div></div>
  <div class="pk-calendar" id="pk-calendar"></div>
  <div class="pk-legend">Green = profitable day · Pink = losing day · Each record includes resolved current-v3 model picks. Recorded units use the stored 0.25u / 0.50u / 1.00u size.</div>
</section>
<div id="pk-modal-bg" class="pk-modal-bg" onclick="if(event.target===this)closeDay()"><div class="pk-modal"><div class="pk-modal-head"><h2 id="pk-modal-title"></h2><button class="pk-btn" onclick="closeDay()">✕ CLOSE</button></div><div id="pk-modal-body"></div></div></div>
{% endblock %}
{% block scripts %}<script>
const pkEsc=v=>String(v??'—').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
let pkMonth=new Date().toISOString().slice(0,7),pkData=null;
const unitInput=document.getElementById('pk-unit-size');unitInput.value=localStorage.getItem('jingleezUnitSize')||'20';
function unitSize(){const n=Number(unitInput.value);return Number.isFinite(n)&&n>=.01&&n<=100000?n:20}
function unitChanged(){unitInput.value=unitSize();localStorage.setItem('jingleezUnitSize',unitInput.value);loadPikkit()}
function moveMonth(delta){let [y,m]=pkMonth.split('-').map(Number);const d=new Date(y,m-1+delta,1);pkMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;loadPikkit()}
function goToday(){pkMonth=new Date().toISOString().slice(0,7);loadPikkit()}
function signed(v,d=2){v=Number(v||0);return `${v>0?'+':''}${v.toFixed(d)}u`}
async function loadPikkit(){const type=document.getElementById('pk-type').value,basis=document.getElementById('pk-basis').value,u=unitSize();const r=await fetch(`/api/pikkit?month=${pkMonth}&type=${type}&basis=${basis}&unit_size=${u}`,{cache:'no-store'}),d=await r.json();if(!r.ok){document.getElementById('pk-calendar').textContent=d.message||'Could not load record';return}pkData=d;document.getElementById('pk-month-label').textContent=d.month_label+` · current v3 · 1u = $${Number(d.filters.unit_size).toFixed(2)}`;const s=d.summary;document.getElementById('pk-summary').innerHTML=`<div class="pk-stat"><strong>${s.wins}-${s.losses}-${s.pushes}</strong><span>MONTH RECORD</span></div><div class="pk-stat"><strong>${s.win_rate==null?'—':s.win_rate+'%'}</strong><span>WIN RATE</span></div><div class="pk-stat"><strong class="${s.net_units>=0?'positive':'negative'}">${signed(s.net_units)}</strong><span>NET UNITS · ${s.net_dollars>=0?'+':''}$${Number(s.net_dollars).toFixed(2)}</span></div><div class="pk-stat"><strong>${s.winning_days}-${s.losing_days}</strong><span>WINNING–LOSING DAYS</span></div>`;const byDay=Object.fromEntries(d.days.map(x=>[x.day,x])),cells=[];for(let i=0;i<d.first_weekday;i++)cells.push('<div class="pk-day empty"></div>');for(let day=1;day<=d.days_in_month;day++){const x=byDay[day];if(!x){cells.push(`<div class="pk-day"><div class="pk-num">${day}</div></div>`);continue}const cls=x.net_units>0?'win':x.net_units<0?'loss':'even',dollars=x.net_units*u;cells.push(`<div class="pk-day ${cls}" onclick="openDay('${x.date}')"><div class="pk-num">${day}</div>${x.pending?`<div class="pk-pending">${x.pending} PENDING</div>`:''}<div class="pk-record">${x.wins}-${x.losses}-${x.pushes}</div><div class="pk-units ${x.net_units>=0?'positive':'negative'}">${signed(x.net_units)}<div style="font-size:8px;margin-top:4px">${dollars>=0?'+':''}$${dollars.toFixed(2)}</div></div></div>`)}document.getElementById('pk-calendar').innerHTML=cells.join('')}
function openDay(date){const d=pkData.days.find(x=>x.date===date);if(!d)return;const dollars=d.net_units*unitSize();document.getElementById('pk-modal-title').textContent=`${date} · ${d.wins}-${d.losses}-${d.pushes} · ${signed(d.net_units)} · ${dollars>=0?'+':''}$${dollars.toFixed(2)}`;document.getElementById('pk-modal-body').innerHTML=d.picks.map(p=>`<div class="pk-row"><div><div class="pk-tag">${pkEsc(p.type).toUpperCase()}</div><strong>${pkEsc(p.pick)}</strong><div style="color:var(--text-muted);margin-top:3px">${pkEsc(p.game)}</div></div><span class="pk-grade ${pkEsc(p.status)}">${pkEsc(p.status).toUpperCase()}</span><span>${Number(p.stake_units).toFixed(2)}u @ ${Number(p.odds).toFixed(3)}</span><span>${p.profit_units==null?'—':signed(p.profit_units)+' / '+(p.profit_dollars>=0?'+':'')+'$'+Number(p.profit_dollars).toFixed(2)}</span><span>EV ${Number(p.ev).toFixed(1)}%</span><span>CLV ${p.clv==null?'—':Number(p.clv).toFixed(2)+'pp'}</span></div>`).join('');document.getElementById('pk-modal-bg').classList.add('open')}
function closeDay(){document.getElementById('pk-modal-bg').classList.remove('open')}
function downloadCsv(){const t=document.getElementById('pk-type').value,b=document.getElementById('pk-basis').value;location.href=`/api/pikkit.csv?month=${pkMonth}&type=${t}&basis=${b}&unit_size=${unitSize()}`}
const pkOriginalFetch=window.fetch.bind(window);window.fetch=(url,options)=>{if(typeof url==='string'&&url.startsWith('/api/pikkit?'))url+=`&tier=${document.getElementById('pk-tier').value}`;return pkOriginalFetch(url,options)};
downloadCsv=function(){const t=document.getElementById('pk-type').value,b=document.getElementById('pk-basis').value,r=document.getElementById('pk-tier').value;location.href=`/api/pikkit.csv?month=${pkMonth}&type=${t}&basis=${b}&tier=${r}&unit_size=${unitSize()}`};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDay()});loadPikkit();
</script>{% endblock %}
